spring.application.name=RUPE
server.port=8080
server.address=0.0.0.0

# LOCAL - H2 en archivo. Conserva los datos entre ejecuciones.
spring.datasource.url=jdbc:h2:file:./data/rupe_db;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.thymeleaf.cache=false
server.error.whitelabel.enabled=false

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=8MB

# Carpetas locales. No se borran al reiniciar RUPE.
rupe.upload-dir=uploads
rupe.backup-dir=respaldos

rupe.public-base-url=http://localhost:8080

server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=false
