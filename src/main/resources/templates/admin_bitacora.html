<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>RUPE - Proyecto Terminal II</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
<header class="encabezado">
    <h1>RUPE - Proyecto Terminal II</h1>
    <p>Registro Único de Perros Extraviados</p>
    <nav>
        <a href="/">Inicio</a>
        <a href="/reportes/nuevo">Registrar perro</a>
        <a href="/reportes/consulta">Consultar folio</a>
        <a href="/admin/login">Administración</a>
    </nav>
</header>
<main class="contenedor">

<section class="tarjeta">
    <h2>Bitácora del sistema</h2>
    <table>
        <thead>
        <tr><th>Fecha</th><th>Usuario</th><th>Módulo</th><th>Acción</th><th>IP</th></tr>
        </thead>
        <tbody>
        <tr th:each="a : ${acciones}">
            <td th:text="${a.fechaHora}"></td>
            <td th:text="${a.usuario}"></td>
            <td th:text="${a.modulo}"></td>
            <td th:text="${a.accion}"></td>
            <td th:text="${a.ip}"></td>
        </tr>
        </tbody>
    </table>
    <a class="boton secundario" href="/admin/dashboard">Volver al panel</a>
</section>

</main>
<footer>
    RUPE - Proyecto Terminal II
</footer>
</body>
</html>
