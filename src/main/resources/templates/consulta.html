<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>RUPE - Proyecto Terminal II</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
<header class="encabezado">
    <h1>RUPE - Proyecto Terminal II</h1>
    <p>Registro Único de Perros Extraviados</p>
    <nav>
        <a href="/">Inicio</a>
        <a href="/reportes/nuevo">Registrar perro</a>
        <a href="/reportes/consulta">Consultar folio</a>
        <a href="/admin/login">Administración</a>
    </nav>
</header>
<main class="contenedor">

<section class="tarjeta">
    <h2>Consultar reporte por folio</h2>
    <div th:if="${error}" class="alerta error" th:text="${error}"></div>
    <form method="post" action="/reportes/consulta" class="formulario">
        <label>Folio</label>
        <input type="text" name="folio" required placeholder="RUPE-2026-0001">
        <button class="boton" type="submit">Buscar</button>
    </form>
</section>

</main>
<footer>
    RUPE - Proyecto Terminal II
</footer>
</body>
</html>
