<!DOCTYPE html>
<html lang="es">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>RUPE</title><link rel="stylesheet" href="/css/styles.css"></head>
<body>
<header class="encabezado">
    <h1>RUPE</h1>
    <p>Registro Único de Perros Extraviados</p>
    <nav>
        <a href="/">Inicio</a>
        <a href="/reportes/nuevo">Registrar perro</a>
        <a href="/reportes/consulta">Consultar folio</a>
        <a href="/admin/login">Administración</a>
    </nav>
</header>
<main class="contenedor">

<section class="tarjeta centro">
    <h2>Reporte registrado correctamente</h2>
    <div class="folio" th:text="${reporte.folio}">RUPE-2026-0001</div>
    <p>Guarda este folio para consultar el reporte después.</p>
    <img class="qr" th:src="@{'/reportes/' + ${reporte.folio} + '/qr'}" alt="Código QR">
    <div class="acciones">
        <a class="boton" th:href="@{'/reportes/' + ${reporte.folio}}">Ver detalle</a>
        <a class="boton secundario" th:href="@{'/reportes/' + ${reporte.folio} + '/pdf'}">Descargar ficha PDF</a>
        <a class="boton claro" href="/">Inicio</a>
    </div>
</section>

</main>
<footer>RUPE - Proyecto Terminal II LRC.</footer>
</body>
</html>
