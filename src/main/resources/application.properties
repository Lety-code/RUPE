spring.application.name=RUPE
server.port=${PORT:8080}
server.address=0.0.0.0

# Configuración para Railway con MySQL.
spring.datasource.url=jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:rupe_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${MYSQLUSER:root}
spring.datasource.password=${MYSQLPASSWORD:root}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.thymeleaf.cache=false
server.error.whitelabel.enabled=false

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=8MB
rupe.upload-dir=uploads
rupe.public-base-url=${PUBLIC_URL:${RUPE_PUBLIC_BASE_URL:https://rupe-production.up.railway.app}}

server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
