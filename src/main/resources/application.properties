spring.application.name=RUPE
server.port=${PORT:8080}
server.address=0.0.0.0

# PRODUCCION / RAILWAY - MySQL
# No usar el perfil local en Railway.
spring.datasource.url=jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:rupe_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&useUnicode=true&characterEncoding=UTF-8
spring.datasource.username=${MYSQLUSER:root}
spring.datasource.password=${MYSQLPASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate actualiza la estructura sin borrar la base existente.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.thymeleaf.cache=false
server.error.whitelabel.enabled=false

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=8MB

# En Railway estas rutas se pueden dirigir a un volumen persistente mediante
# RUPE_UPLOAD_DIR y RUPE_BACKUP_DIR. Si no se definen, se usan carpetas locales.
rupe.upload-dir=${RUPE_UPLOAD_DIR:uploads}
rupe.backup-dir=${RUPE_BACKUP_DIR:respaldos}

# URL publica usada para QR y enlaces del sistema.
rupe.public-base-url=${RUPE_PUBLIC_BASE_URL:${PUBLIC_URL:https://rupe-production.up.railway.app}}

# Seguridad de sesion en produccion.
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:true}
